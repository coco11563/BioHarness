[build-system]
requires      = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name            = "bioharness"
version         = "0.1.0"
description     = "bioHarness headline method (registered as the ``pipeline`` framework-eval method)."
readme          = "README.md"
requires-python = ">=3.10,<3.13"
license         = { text = "Apache-2.0" }
authors         = [{ name = "bioHarness authors" }]
keywords        = [
  "biomedical", "question-answering", "rag", "agent",
  "retrieval-augmented-generation", "cascade",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "framework-eval>=0.1.0,<1",
  "httpx>=0.27,<1",
  "qdrant-client>=1.9,<2",
  "psycopg[binary]>=3.1,<4",
  "numpy>=1.24,<3",
  "pydantic>=2.6,<3",
  "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "pre-commit>=3.7,<5",
  "build>=1.2,<2",
]

[project.scripts]
bioharness = "bioharness.cli:main"

[project.entry-points."framework_eval.methods"]
# Default headline method: the in-tree cascade. Self-contained.
pipeline             = "bioharness.cascade.client:PipelineCascadeClient"
# Full-delegation variant that wraps the upstream production cascade
# end-to-end when BIOHARNESS_PRODUCTION_SRC points at the production
# source tree.
pipeline-production  = "bioharness.cascade.production_client:ProductionPipelineCascadeClient"

[project.urls]
Homepage             = "https://github.com/coco11563/bioHarness"
Repository           = "https://github.com/coco11563/bioHarness"
Issues               = "https://github.com/coco11563/bioHarness/issues"
EvaluationFramework  = "https://github.com/coco11563/XCompass_Eval_Framework"
Dataset              = "https://huggingface.co/datasets/Shaow/GeneKnowledgeEval"

[tool.hatch.build.targets.wheel]
packages = ["src/bioharness"]

[tool.hatch.build.targets.sdist]
include = [
  "src/bioharness", "tests", "docs", "scripts", "golden",
  "MANIFEST.toml", "verify.py", "README.md", "LICENSE", "CHANGELOG.md",
  "CITATION.cff", "CONTRIBUTING.md",
]

[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "PL", "RUF"]
ignore = [
  "PLR0913", "PLR2004",
  # Lazy imports are a deliberate convention here: the optional framework_eval
  # dependency, lighter module load, and avoiding import cycles.
  "PLC0415",
  # Flat type-dispatch functions (e.g. extract_constrained_answer) are readable;
  # the return/branch caps are false positives there.
  "PLR0911", "PLR0912",
]

[tool.mypy]
python_version       = "3.10"
strict               = true
ignore_missing_imports = true
files                = ["src/bioharness"]

[tool.pytest.ini_options]
testpaths       = ["tests"]
addopts         = "-ra --strict-markers"
markers = [
  "live: tests that require user-provided inference infrastructure",
]

[tool.pytest_asyncio]
asyncio_mode = "auto"
